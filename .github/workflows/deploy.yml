name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours. The run deploys only when the app has a new release.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build
        run: node build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: node check.mjs
      - name: Compare with the live site
        id: live
        run: |
          built=$(jq -r .version dist/version.json)
          live=$(curl -fsS --max-time 20 https://ownyourniimbot.com/version.json | jq -r .version || echo none)
          echo "Built $built, live $live"
          if [ "$built" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name != 'schedule' || steps.live.outputs.changed == 'true')
        run: npx --yes wrangler@4.166.0 deploy
